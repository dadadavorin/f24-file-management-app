name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test

      - name: Export the OpenAPI contract
        run: php artisan scramble:export

      - name: Fail if the committed OpenAPI contract is stale
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend contract-generation dependencies
        working-directory: web
        run: npm install

      - name: Regenerate the TypeScript types from the OpenAPI contract
        working-directory: web
        run: npm run api:types

      - name: Fail if the committed TypeScript types are stale
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code web/src/api/generated/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check and lint
        run: npm run check

      - name: Test
        run: npm run test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for the app to become reachable
        run: |
          timeout 300 bash -c \
            'until curl -sf http://localhost:8080/api/v1/health && curl -sf http://localhost:8080/ >/dev/null; do sleep 3; done'

      - name: Run database migrations
        run: docker compose exec -T app php artisan migrate --force

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run the end-to-end specs
        working-directory: e2e
        run: npm test

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
