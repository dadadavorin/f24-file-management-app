server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        alias /var/www/html/api/public/;
        try_files $uri @api;
    }

    # Laravel has a single entry point; every non-static /api/ request runs
    # public/index.php, which reads the real path from REQUEST_URI.
    location @api {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Vite dev server. Upgrade headers are required for its HMR websocket.
    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
