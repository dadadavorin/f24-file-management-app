server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Placeholder until T10 points this at the Vite dev server.
    root /var/www/html/web-placeholder;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        alias /var/www/html/api/public/;
        try_files $uri @api;
    }

    # Laravel has a single entry point; every non-static /api/ request runs
    # public/index.php, which reads the real path from REQUEST_URI.
    location @api {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
